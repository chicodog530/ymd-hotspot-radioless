name: Alpha18.2.5 Recovery Audit
on:
  push:
    branches: [dev-plugins-alpha18.2.5-recovery]
  pull_request:
    branches: [dev-plugins]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          set -euxo pipefail
          bash -n lib/oled_owner.sh
          node --check web/app.js
          test "$(cat VERSION)" = '0.1.0-alpha18.2.5-dev'
      - name: OLED idempotence on normal settings apply
        run: |
          set -euxo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/bin" "$tmp/app/lib"
          cp lib/oled.py "$tmp/app/lib/oled.py"
          cat > "$tmp/config.json" <<'EOF'
          {"display":{"enabled":true}}
          EOF
          cat > "$tmp/bin/systemctl" <<'SH'
          #!/usr/bin/env bash
          echo "$*" >> "$YWD_SYSTEMCTL_LOG"
          case "$1" in
            cat) exit 0 ;;
            is-enabled) exit 0 ;;
            *) exit 0 ;;
          esac
          SH
          chmod +x "$tmp/bin/systemctl"
          export PATH="$tmp/bin:$PATH"
          export YWD_SYSTEMCTL_LOG="$tmp/systemctl.log"
          export YWD_LIVE_APP="$tmp/app"
          export YWD_CONFIG="$tmp/config.json"
          sudo -E env PATH="$PATH" YWD_SYSTEMCTL_LOG="$YWD_SYSTEMCTL_LOG" YWD_LIVE_APP="$YWD_LIVE_APP" YWD_CONFIG="$YWD_CONFIG" bash lib/oled_owner.sh install
          first="$(grep -c '^daemon-reload$' "$tmp/systemctl.log" || true)"
          test "$first" -eq 1
          : > "$tmp/systemctl.log"
          sudo -E env PATH="$PATH" YWD_SYSTEMCTL_LOG="$YWD_SYSTEMCTL_LOG" YWD_LIVE_APP="$YWD_LIVE_APP" YWD_CONFIG="$YWD_CONFIG" bash lib/oled_owner.sh install
          second="$(grep -c '^daemon-reload$' "$tmp/systemctl.log" || true)"
          test "$second" -eq 0
      - name: Visible update checking feedback guards
        run: |
          set -euxo pipefail
          grep -q "ywd-check-spinner" web/app.js
          grep -q "button.prepend(spin)" web/app.js
          grep -q "aria-busy" web/app.js
          grep -q "ywd-check-pulse" web/app.js
          grep -q "prefers-reduced-motion" web/app.js
